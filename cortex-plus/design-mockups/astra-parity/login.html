<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Giriş — Cortex Plus mockup</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="app.css" />
    <style>
      .cp-auth-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-bottom: 2rem;
      }
      .cp-auth-logo {
        text-align: center;
        font-weight: 800;
        font-size: 1.25rem;
        margin-bottom: 2rem;
      }
    </style>
  </head>
  <body>
    <div class="cp-mock-banner">
      Mockup 3/5 · Karşılaştır: <strong>app.astra-ai.co login</strong> ·
      <a href="index.html">Tüm ekranlar</a>
    </div>
    <div class="cp-app-frame">
      <header class="cp-app-top">
        <a href="marketing.html" style="font-size: 0.875rem; font-weight: 700; color: var(--cp-muted)"
          >Cortex Plus</a
        >
        <a href="onboarding.html" style="font-size: 0.8125rem; font-weight: 600; color: var(--cp-yellow)"
          >Kayıt ol</a
        >
      </header>
      <main class="cp-app-main cp-auth-wrap">
        <p class="cp-auth-logo">Cortex Plus</p>
        <h1 class="cp-step-title" style="margin-top: 0; text-align: center">Tekrar hoş geldin</h1>
        <p class="cp-step-lead" style="text-align: center; margin-bottom: 1.5rem">
          Google ile saniyeler içinde devam et veya e-postanla giriş yap.
        </p>

        <button type="button" class="cp-btn-google">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            />
            <path
              fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            />
            <path
              fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
            />
            <path
              fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
            />
          </svg>
          Google ile devam et
        </button>

        <div class="cp-divider">veya e-posta ile</div>

        <form action="sor.html">
          <div class="cp-field">
            <label for="email">E-posta</label>
            <input id="email" type="email" autocomplete="email" placeholder="ornek@email.com" />
          </div>
          <div class="cp-field">
            <label for="pass">Şifre</label>
            <input id="pass" type="password" autocomplete="current-password" />
          </div>
          <button type="submit" class="cp-btn-primary" style="width: 100%">Giriş yap</button>
        </form>
        <p style="text-align: center; margin-top: 1rem; font-size: 0.8125rem">
          <a href="#" style="color: var(--cp-muted)">Şifreni mi unuttun?</a>
        </p>
      </main>
    </div>
  </body>
</html>

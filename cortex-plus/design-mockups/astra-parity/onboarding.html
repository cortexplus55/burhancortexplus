<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Onboarding — Cortex Plus mockup</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="cp-mock-banner">
      Mockup 2/5 · Karşılaştır: <strong>app.astra-ai.co onboarding</strong> ·
      <a href="index.html">Tüm ekranlar</a>
    </div>
    <div class="cp-app-frame">
      <div class="cp-progress" aria-hidden="true">
        <div class="cp-progress-fill" style="width: 20%"></div>
      </div>
      <header class="cp-app-top">
        <a href="marketing.html" style="font-size: 0.875rem; font-weight: 700; color: var(--cp-muted)"
          >←</a
        >
        <span style="font-size: 0.75rem; color: var(--cp-muted)">Adım 1/5</span>
      </header>
      <main class="cp-app-main">
        <p class="cp-label">Hoş geldin</p>
        <h1 class="cp-step-title">Sen kimsin?</h1>
        <p class="cp-step-lead">
          Sana en uygun deneyimi açmak için rolünü seç. Sonra birkaç kısa soru
          soracağız.
        </p>

        <button type="button" class="cp-choice" aria-checked="true">
          <span class="cp-choice-emoji" aria-hidden="true">🎓</span>
          <span>
            <span class="cp-choice-title">Öğrenciyim</span>
            <p class="cp-choice-body">Sor çöz, deneme yap, planını takip et.</p>
          </span>
        </button>
        <button type="button" class="cp-choice" aria-checked="false">
          <span class="cp-choice-emoji" aria-hidden="true">👨‍👩‍👧</span>
          <span>
            <span class="cp-choice-title">Veliyim</span>
            <p class="cp-choice-body">Çocuğunun ilerlemesini birlikte izle. (Sonraki faz)</p>
          </span>
        </button>
        <button type="button" class="cp-choice" aria-checked="false">
          <span class="cp-choice-emoji" aria-hidden="true">📚</span>
          <span>
            <span class="cp-choice-title">Öğretmenim</span>
            <p class="cp-choice-body">AI araçları ve sınıf yönetimi. (Sonraki faz)</p>
          </span>
        </button>

        <a class="cp-btn-primary" href="onboarding.html" style="width: 100%; margin-top: 1.5rem"
          >Devam</a
        >
        <p style="text-align: center; margin-top: 1rem; font-size: 0.8125rem; color: var(--cp-muted)">
          Hesabın var mı? <a href="login.html" style="color: var(--cp-yellow); font-weight: 600">Giriş yap</a>
        </p>
      </main>
    </div>
  </body>
</html>

<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Bağlantı koptu · Cortex Plus</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #05070e;
        color: #f1f5f9;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        min-height: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        max-width: 30ch;
        font-size: 15px;
        line-height: 1.5;
        color: #94a3b8;
      }
      button {
        margin-top: 8px;
        min-height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: #4353f3;
        color: #fff;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
      }
      button:focus-visible {
        outline: 2px solid #22d3ee;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bağlantı koptu</h1>
      <p>Cortex Plus internete ulaşamadı. Wi-Fi ya da mobil verini kontrol edip yeniden dene.</p>
      <button type="button" id="retry">Tekrar dene</button>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        window.location.href = "https://cortexplus.app/ogretmen";
      });
    </script>
  </body>
</html>

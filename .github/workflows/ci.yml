name: CI

on:
  push:
    branches: [main]
    paths:
      - "cortex-plus/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "cortex-plus/**"

defaults:
  run:
    working-directory: cortex-plus

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cortex-plus/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dgjfyewgrukglsehyntc.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-build-key

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cortex-plus/package-lock.json
      - run: npm ci
      - run: npm run test

  # Tarayıcı testleri. Bunlar CI'da hiç çalışmıyordu ve bir test aylarca
  # sessizce düşük kaldı: kimse görmedi çünkü kimse elle çalıştırmadı.
  # Playwright'ın kendi tarayıcısını indirmesi gerekiyor (--with-deps), bu da
  # işi yaklaşık iki dakika uzatıyor. Karşılığı: bir sayfayı bozan değişiklik
  # yayına çıkmadan yakalanıyor.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cortex-plus/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Düşen bir testin ekran görüntüsü ve izi olmadan sebebini bulmak
      # tahmin işine dönüyor.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: cortex-plus/playwright-report
          retention-days: 7

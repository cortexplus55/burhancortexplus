name: CI

on:
  push:
    branches: [main]
    paths:
      - "cortex-plus/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "cortex-plus/**"

defaults:
  run:
    working-directory: cortex-plus

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cortex-plus/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dgjfyewgrukglsehyntc.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-build-key

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cortex-plus/package-lock.json
      - run: npm ci
      - run: npm run test
